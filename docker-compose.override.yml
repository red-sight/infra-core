services:
  traefik:
    ports:
      - "8080:8080"
    command:
      - --providers.docker=true
      - --providers.docker.network=${INFRA_NETWORK_NAME:-infra}
      - --providers.docker.exposedbydefault=false
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  logto:
    ports:
      - "3001:3001"
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  logto-init:
    depends_on:
      logto:
        condition: service_healthy

  krakend:
    # Dev: krakend.json is generated by the registrator (auto mode) and is
    # gitignored. Seed it from the committed bootstrap on first boot so KrakenD
    # can start before the registrator has written the real config. Writable
    # mount because the seed copies into the dir; the registrator then overwrites.
    volumes:
      - ./config/krakend:/etc/krakend
    command:
      - sh
      - -c
      - test -f /etc/krakend/krakend.json || cp /etc/krakend/krakend.bootstrap.json /etc/krakend/krakend.json; exec krakend run -c /etc/krakend/krakend.json
    depends_on:
      logto:
        condition: service_healthy

  nats:
    ports:
      - "4223:4222"
      - "8223:8222"

  service-core:
    depends_on:
      postgres:
        condition: service_healthy

  service-a:
    build:
      context: ./service-a
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./service-a:/app
      - /app/node_modules

  registrator:
    build:
      context: ./registrator
      target: dev
    volumes:
      - ./registrator:/app
      # Auto mode writes the KrakenD config file and the aggregated openapi spec.
      - ./config/krakend:/etc/krakend
      - ./config/openapi:/specs
    depends_on:
      krakend:
        condition: service_healthy

  swagger:
    depends_on:
      registrator:
        condition: service_healthy

  admin:
    build:
      target: dev
      args:
        UID: "${CURRENT_UID:-1000}"
        GID: "${CURRENT_GID:-1000}"
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    labels:
      traefik.http.services.admin.loadbalancer.server.port: "5173"
    depends_on:
      logto-init:
        condition: service_completed_successfully
