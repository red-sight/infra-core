name: infra

networks:
  infra:
    name: ${INFRA_NETWORK_NAME:-infra}

volumes:
  postgres_data:
  redis_data:
  infra_init_data:

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    networks:
      infra:
        aliases:
          - ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
          - ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
          - ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}-admin.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
          - ${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker=true
      - --providers.docker.network=${INFRA_NETWORK_NAME:-infra}
      - --providers.docker.exposedbydefault=false
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --ping=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.traefik-dashboard.service: "api@internal"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - infra
    environment:
      POSTGRES_USER: ${INFRA_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${INFRA_PG_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFRA_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  logto:
    image: svhd/logto:latest
    restart: unless-stopped
    networks:
      - infra
    environment:
      DB_URL: postgres://${INFRA_PG_USER:-postgres}:${INFRA_PG_PASSWORD:-postgres}@postgres:5432/${INFRA_PG_LOGTO_DB:-logto}
      PORT: 3001
      ADMIN_PORT: 3002
      ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      ADMIN_ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}-admin.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      TRUST_PROXY_HEADER: "1"
    entrypoint: ["sh", "-c", "npx @logto/cli db seed --db-url $$DB_URL 2>/dev/null; npx @logto/cli db alteration deploy latest --db-url $$DB_URL 2>/dev/null; npm start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.logto.rule: "Host(`${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.logto.service: "logto"
      traefik.http.services.logto.loadbalancer.server.port: "3001"
      traefik.http.routers.logto-admin.rule: "Host(`${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}-admin.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.logto-admin.service: "logto-admin"
      traefik.http.services.logto-admin.loadbalancer.server.port: "3002"

  logto-init:
    build: ./scripts/logto
    networks:
      - infra
    volumes:
      - infra_init_data:/run/infra
    environment:
      LOGTO_ADMIN_ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}-admin.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      LOGTO_ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      DB_URL: postgres://${INFRA_PG_USER:-postgres}:${INFRA_PG_PASSWORD:-postgres}@postgres:5432/${INFRA_PG_LOGTO_DB:-logto}
      ADMIN_USERNAME: ${INFRA_LOGTO_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${INFRA_LOGTO_ADMIN_PASSWORD:?INFRA_LOGTO_ADMIN_PASSWORD is required}
      API_RESOURCE_INDICATOR: ${INFRA_LOGTO_API_RESOURCE_ID:?INFRA_LOGTO_API_RESOURCE_ID is required}
      INFRA_HTTP_PROTOCOL: ${INFRA_HTTP_PROTOCOL:-http}
      INFRA_HTTP_BASE_DOMAIN: ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      INFRA_ADMIN_SUBDOMAIN: ${INFRA_ADMIN_SUBDOMAIN:-admin}
    restart: on-failure

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    networks:
      - infra
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  service-core:
    build:
      context: .
      dockerfile: service-core/Dockerfile
    restart: unless-stopped
    networks:
      - infra
    volumes:
      # M2M creds written by logto-init; service-core reads them to provision
      # organizations in Logto (the outbox worker's downstream target).
      - infra_init_data:/run/infra:ro
    environment:
      DATABASE_URL: postgres://${INFRA_PG_USER:-postgres}:${INFRA_PG_PASSWORD:-postgres}@postgres:5432/${INFRA_PG_CORE_DB:-service_core}
      PORT: "8080"
      INFRA_SERVICE_CORE_M2M_FILE: /run/infra/service-core-m2m.json
      OUTBOX_POLL_INTERVAL: ${INFRA_CORE_OUTBOX_POLL_INTERVAL:-2s}
      OUTBOX_MAX_ATTEMPTS: ${INFRA_CORE_OUTBOX_MAX_ATTEMPTS:-10}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      infra.enabled: "true"
      infra.name: service-core
      infra.port: "8080"
      infra.openapi-route: openapi.json
      infra.auth.protected: "true"

  service-a:
    build: ./service-a
    restart: unless-stopped
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      infra.enabled: "true"
      infra.name: service-a
      infra.port: "3000"
      infra.openapi-route: openapi
      infra.auth.protected: "true"

  swagger:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    networks:
      - infra
    environment:
      SWAGGER_JSON_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/openapi.json
      BASE_URL: /${INFRA_DOCS_ROUTE:-docs}
    labels:
      traefik.enable: "true"
      traefik.http.routers.swagger.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && PathPrefix(`/${INFRA_DOCS_ROUTE:-docs}`)"
      traefik.http.routers.swagger.service: "swagger"
      traefik.http.services.swagger.loadbalancer.server.port: "8080"

  krakend:
    image: krakend:latest
    restart: unless-stopped
    networks:
      - infra
    # Config delivery differs by environment: the override mounts ./config/krakend
    # (dev, registrator writes the file); the swarm file delivers a config object.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.krakend.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && PathPrefix(`/${INFRA_API_ROUTE:-api}`)"
      traefik.http.routers.krakend.service: "krakend"
      traefik.http.services.krakend.loadbalancer.server.port: "8080"

  registrator:
    build: ./registrator
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - infra_init_data:/run/infra:ro
      # The ./config/krakend (write) and ./config/openapi binds are auto-mode
      # (dev) only and live in the override; in swarm the registrator delivers a
      # config object instead of writing a file.
    environment:
      INFRA_MODE: ${INFRA_MODE:-}
      INFRA_HTTP_PROTOCOL: ${INFRA_HTTP_PROTOCOL:-http}
      INFRA_HTTP_BASE_DOMAIN: ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      INFRA_HTTP_OIDC_SUBDOMAIN: ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}
      INFRA_API_ROUTE: ${INFRA_API_ROUTE:-api}
      INFRA_LOGTO_API_RESOURCE_ID: ${INFRA_LOGTO_API_RESOURCE_ID}
      INFRA_LOGTO_ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      INFRA_REGISTRATOR_RELOAD_DELAY: ${INFRA_REGISTRATOR_RELOAD_DELAY:-5s}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.registrator-spec.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && Path(`/openapi.json`)"
      traefik.http.routers.registrator-spec.service: "registrator-spec"
      traefik.http.services.registrator-spec.loadbalancer.server.port: "8081"

  admin:
    build:
      context: ./admin
      target: prod
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - infra_init_data:/run/infra:ro
    environment:
      VITE_REDIRECT_URI: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/callback
      VITE_API_BASE_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/${INFRA_API_ROUTE:-api}
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: "Host(`${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.admin.entrypoints: "web"
      traefik.http.services.admin.loadbalancer.server.port: "80"
