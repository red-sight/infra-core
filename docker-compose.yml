services:
  traefik:
    image: traefik:v3.6.2
    container_name: ${APP_NAME}_traefik
    ports:
      - '80:80'
      - '8081:8080'
    extra_hosts:
      - '${KC_HOSTNAME}:host-gateway'
    env_file:
      - path: .env
        required: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./config/traefik/dynamic-configuration.yml:/etc/traefik/dynamic-configuration.yml
      - traefik-plugins:/plugins-storage
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dashboard.rule=Host(`dashboard.localhost`)'
      - 'traefik.http.routers.dashboard.service=api@internal'

  keycloak:
    image: keycloak-local
    container_name: ${APP_NAME}_keycloak
    build:
      context: ./config/keycloak
      dockerfile: ./Dockerfile.keycloak
      args:
        REALM: ${APP_NAME}
        DEMO_REALM_CLIENT_ID: ${DEMO_REALM_CLIENT_ID}
        DEMO_REALM_SECRET: ${DEMO_REALM_SECRET}
        FRONTEND_HOST: ${FRONTEND_HOST}
        FRONTEND_PROTOCOL: ${FRONTEND_PROTOCOL}
        DEMO_REALM_TEST_USER_LOGIN: ${DEMO_REALM_TEST_USER_LOGIN}
        DEMO_REALM_TEST_USER_EMAIL: ${DEMO_REALM_TEST_USER_EMAIL}
        DEMO_REALM_TEST_USER_PASSWORD: ${DEMO_REALM_TEST_USER_PASSWORD}
    env_file:
      - path: .env
        required: true
    environment:
      SECRET: ${KC_SECRET}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.keycloak.rule=Host(`${KC_HOSTNAME}`)'
      - 'traefik.http.services.keycloak.loadbalancer.server.port=8080'
    command: ['start-dev', '--import-realm']
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  krakend:
    image: krakend:watch
    container_name: ${APP_NAME}_krakend
    volumes:
      - ./config/krakend:/etc/krakend/
    ports:
      - '$API_GATEWAY_PORT:8080'
    command: ['run', '--config', '/etc/krakend/krakend.json']
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.be.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.be.entrypoints=http
      - traefik.http.middlewares.be-stripprefix.stripprefix.prefixes=/api
      - traefik.http.routers.be.middlewares=be-stripprefix,oidc-auth-api@file
      - traefik.http.services.be.loadbalancer.server.port=$API_GATEWAY_PORT

  registry:
    image: node:24
    container_name: ${APP_NAME}_registry
    working_dir: /app
    volumes:
      - ./registry:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/krakend:/krakend/
    env_file: .env
    command: 'npm run start:dev'
    depends_on:
      traefik:
        condition: service_healthy

  postgres:
    image: postgres:18.1-alpine
    container_name: ${APP_NAME}_postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h localhost -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      interval: '10s'
      timeout: '30s'
      retries: 5
      start_period: '20s'

networks:
  default:
    name: ${APP_NAME}
    external: true

volumes:
  postgres:
    name: ${APP_NAME}_postgres
  traefik-plugins:
