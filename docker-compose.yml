name: infra

networks:
  infra:
    name: ${INFRA_NETWORK_NAME:-infra}

volumes:
  postgres_data:
  redis_data:
  infra_init_data:
  zitadel_machinekey:

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    networks:
      infra:
        aliases:
          - ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
          - ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
          - ${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker=true
      - --providers.docker.network=${INFRA_NETWORK_NAME:-infra}
      - --providers.docker.exposedbydefault=false
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --ping=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.traefik-dashboard.service: "api@internal"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - infra
    environment:
      POSTGRES_USER: ${INFRA_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${INFRA_PG_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFRA_PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Zitadel — the identity provider (replaces Logto). One instance, one issuer
  # (RS256); per-organization isolation, branding and OIDC apps live inside it.
  # Reachability is via Traefik at auth.<base>; the container always listens on
  # :8080 (ExternalPort only shapes the issuer URL).
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.2
    restart: unless-stopped
    # start-from-init runs init + setup + start in one container (idempotent on an
    # existing DB). --tlsMode disabled = serve plain HTTP (dev); swarm overrides to
    # external (TLS terminated at Traefik).
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    networks:
      - infra
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-prepare:
        condition: service_completed_successfully
    environment:
      ZITADEL_MASTERKEY: ${INFRA_ZITADEL_MASTERKEY:?INFRA_ZITADEL_MASTERKEY is required (exactly 32 chars)}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      ZITADEL_EXTERNALPORT: "80"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${INFRA_PG_ZITADEL_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${INFRA_PG_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${INFRA_PG_PASSWORD:-postgres}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${INFRA_PG_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${INFRA_PG_PASSWORD:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Bootstrap a machine (service-account) user + PAT to the shared volume, read
      # by zitadel-init to provision the instance (mirrors the old M2M file pattern).
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/admin-sa.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Admin SA
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      # Human admin for the Zitadel console (login at auth.<base>/ui/console).
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${INFRA_ZITADEL_ADMIN_USERNAME:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${INFRA_ZITADEL_ADMIN_PASSWORD:?INFRA_ZITADEL_ADMIN_PASSWORD is required}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    volumes:
      - zitadel_machinekey:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.zitadel.rule: "Host(`${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.zitadel.service: "zitadel"
      # Plain HTTP backend: our clients use Zitadel's REST/OIDC endpoints (HTTP/1.1),
      # and the console uses gRPC-web — neither needs native gRPC, so no h2c. h2c made
      # Traefik rewrite the HTTP/2 :authority to the backend IP, breaking Zitadel's
      # host-based instance detection (404). Keeping HTTP/1.1 preserves the Host header.
      traefik.http.services.zitadel.loadbalancer.server.port: "8080"

  # Zitadel runs as a non-root user and cannot write to a freshly-created named
  # volume (root-owned mountpoint). Make the machinekey dir writable before start
  # so FirstInstance can drop the PAT there. Dev convenience; prod uses secrets.
  zitadel-prepare:
    image: alpine:3
    command: ["sh", "-c", "mkdir -p /machinekey && chmod 0777 /machinekey"]
    volumes:
      - zitadel_machinekey:/machinekey

  # One-shot bootstrap: reads the admin-sa PAT, then provisions the instance
  # (project, roles, default org, OIDC apps, machine creds, HTTP email provider,
  # branding) idempotently. Implemented in scripts/zitadel (Phase 2).
  zitadel-init:
    build: ./scripts/zitadel
    networks:
      - infra
    volumes:
      - zitadel_machinekey:/machinekey:ro
      - infra_init_data:/run/infra
    environment:
      # Reach Zitadel by its issuer host (via the Traefik network alias) so the Host
      # header matches the instance domain — calling http://zitadel:8080 directly
      # sends Host "zitadel:8080" and Zitadel returns 404 (no such instance).
      ZITADEL_API_ENDPOINT: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      ZITADEL_PAT_FILE: /machinekey/admin-sa.pat
      INFRA_HTTP_PROTOCOL: ${INFRA_HTTP_PROTOCOL:-http}
      INFRA_HTTP_BASE_DOMAIN: ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      INFRA_ADMIN_SUBDOMAIN: ${INFRA_ADMIN_SUBDOMAIN:-admin}
      # Used to grant the platform admin the `admin` project role on bootstrap.
      INFRA_ZITADEL_ADMIN_USERNAME: ${INFRA_ZITADEL_ADMIN_USERNAME:-admin}
    restart: on-failure

  # Zitadel Login UI v2 — the hosted login is a separate app in Zitadel v4. The core
  # only redirects OIDC auth to /ui/v2/login; this container serves it. Runs as the
  # login-client service user (IAM_LOGIN_CLIENT) whose PAT zitadel-init writes.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.2
    restart: unless-stopped
    networks:
      - infra
    depends_on:
      zitadel:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
    volumes:
      - infra_init_data:/run/infra:ro
    environment:
      # Reach the core by its issuer host (via the Traefik alias) so the Host header
      # matches the instance — calling http://zitadel:8080 directly would 404.
      ZITADEL_API_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      ZITADEL_SERVICE_USER_TOKEN_FILE: /run/infra/login-client.pat
    labels:
      traefik.enable: "true"
      traefik.http.routers.zitadel-login.rule: "Host(`${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && PathPrefix(`/ui/v2/login`)"
      # Higher priority than the catch-all zitadel router so the login path wins.
      traefik.http.routers.zitadel-login.priority: "100"
      traefik.http.services.zitadel-login.loadbalancer.server.port: "3000"

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    networks:
      - infra
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  service-core:
    build:
      context: .
      dockerfile: service-core/Dockerfile
    restart: unless-stopped
    networks:
      - infra
    volumes:
      # M2M creds written by zitadel-init; service-core reads them to provision
      # organizations in Zitadel (the outbox worker's downstream target).
      - infra_init_data:/run/infra:ro
    environment:
      DATABASE_URL: postgres://${INFRA_PG_USER:-postgres}:${INFRA_PG_PASSWORD:-postgres}@postgres:5432/${INFRA_PG_CORE_DB:-service_core}
      PORT: "8080"
      INFRA_SERVICE_CORE_M2M_FILE: /run/infra/service-core-m2m.json
      INFRA_TENANT_APP_FILE: /run/infra/tenant-app.json
      # Used to derive each tenant's frontend origin (<proto>://<slug>.<base>) for
      # OIDC redirect-URI registration.
      INFRA_HTTP_PROTOCOL: ${INFRA_HTTP_PROTOCOL:-http}
      INFRA_HTTP_BASE_DOMAIN: ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      # Default (apex-domain) organization for the non-SaaS case — seeded on
      # startup if absent.
      INFRA_DEFAULT_ORG_NAME: ${INFRA_DEFAULT_ORG_NAME:-Master}
      OUTBOX_POLL_INTERVAL: ${INFRA_CORE_OUTBOX_POLL_INTERVAL:-2s}
      OUTBOX_MAX_ATTEMPTS: ${INFRA_CORE_OUTBOX_MAX_ATTEMPTS:-10}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      infra.enabled: "true"
      infra.name: service-core
      infra.port: "8080"
      infra.openapi-route: openapi.json
      infra.auth.protected: "true"

  service-a:
    build: ./service-a
    restart: unless-stopped
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      infra.enabled: "true"
      infra.name: service-a
      infra.port: "3000"
      infra.openapi-route: openapi
      infra.auth.protected: "true"

  swagger:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    networks:
      - infra
    environment:
      SWAGGER_JSON_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/openapi.json
      BASE_URL: /${INFRA_DOCS_ROUTE:-docs}
    labels:
      traefik.enable: "true"
      traefik.http.routers.swagger.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && PathPrefix(`/${INFRA_DOCS_ROUTE:-docs}`)"
      traefik.http.routers.swagger.service: "swagger"
      traefik.http.services.swagger.loadbalancer.server.port: "8080"

  krakend:
    image: krakend:latest
    restart: unless-stopped
    networks:
      - infra
    # Config delivery differs by environment: the override mounts ./config/krakend
    # (dev, registrator writes the file); the swarm file delivers a config object.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.krakend.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && PathPrefix(`/${INFRA_API_ROUTE:-api}`)"
      traefik.http.routers.krakend.service: "krakend"
      traefik.http.services.krakend.loadbalancer.server.port: "8080"

  registrator:
    build: ./registrator
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - infra_init_data:/run/infra:ro
      # The ./config/krakend (write) and ./config/openapi binds are auto-mode
      # (dev) only and live in the override; in swarm the registrator delivers a
      # config object instead of writing a file.
    environment:
      INFRA_MODE: ${INFRA_MODE:-}
      INFRA_HTTP_PROTOCOL: ${INFRA_HTTP_PROTOCOL:-http}
      INFRA_HTTP_BASE_DOMAIN: ${INFRA_HTTP_BASE_DOMAIN:-app.localhost}
      INFRA_HTTP_OIDC_SUBDOMAIN: ${INFRA_HTTP_OIDC_SUBDOMAIN:-auth}
      INFRA_ADMIN_SUBDOMAIN: ${INFRA_ADMIN_SUBDOMAIN:-admin}
      INFRA_API_ROUTE: ${INFRA_API_ROUTE:-api}
      # JWT audience = the Zitadel project id; read from the descriptor zitadel-init
      # writes to /run/infra. Override the scope→role policy with INFRA_GATEWAY_ROLE_SCOPES.
      INFRA_ZITADEL_PLATFORM_FILE: /run/infra/zitadel-platform.json
      # Optional: comma-separated extra browser origins allowed to call the gateway
      # (defaults to the admin SPA origin derived above). E.g. a local Vite dev server.
      INFRA_CORS_ALLOW_ORIGINS: ${INFRA_CORS_ALLOW_ORIGINS:-}
      INFRA_REGISTRATOR_RELOAD_DELAY: ${INFRA_REGISTRATOR_RELOAD_DELAY:-5s}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.registrator-spec.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`) && Path(`/openapi.json`)"
      traefik.http.routers.registrator-spec.service: "registrator-spec"
      traefik.http.services.registrator-spec.loadbalancer.server.port: "8081"

  admin:
    build:
      context: ./admin
      target: prod
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - infra_init_data:/run/infra:ro
    environment:
      VITE_REDIRECT_URI: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/callback
      VITE_API_BASE_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/${INFRA_API_ROUTE:-api}
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: "Host(`${INFRA_ADMIN_SUBDOMAIN:-admin}.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.admin.entrypoints: "web"
      traefik.http.services.admin.loadbalancer.server.port: "80"

  # Shared multi-tenant frontend: one app serves every organization, selected by
  # subdomain (<slug>.<base>). The redirect URI for each tenant origin is registered
  # in the shared Zitadel Tenant app by service-core's outbox on org creation.
  tenant-web:
    build:
      context: ./tenant-web
      target: prod
    restart: unless-stopped
    networks:
      - infra
    volumes:
      - infra_init_data:/run/infra:ro
    environment:
      VITE_API_BASE_URL: ${INFRA_HTTP_PROTOCOL:-http}://${INFRA_HTTP_BASE_DOMAIN:-app.localhost}/${INFRA_API_ROUTE:-api}
    labels:
      traefik.enable: "true"
      # Wildcard subdomain catch-all; lower priority than the exact Host() routers
      # above (admin/auth/auth-admin/traefik) so those win for their own hosts.
      traefik.http.routers.tenant.rule: "HostRegexp(`^[a-z0-9-]+\\.${INFRA_HTTP_BASE_DOMAIN:-app.localhost}$`)"
      traefik.http.routers.tenant.entrypoints: "web"
      traefik.http.routers.tenant.priority: "1"
      traefik.http.services.tenant.loadbalancer.server.port: "80"
      # Apex domain serves the master organization (empty slug) via the same app.
      # Lower priority than the path routers on the apex (api/docs/openapi.json),
      # which are more specific and win for their paths.
      traefik.http.routers.tenant-apex.rule: "Host(`${INFRA_HTTP_BASE_DOMAIN:-app.localhost}`)"
      traefik.http.routers.tenant-apex.entrypoints: "web"
      traefik.http.routers.tenant-apex.priority: "1"
      traefik.http.routers.tenant-apex.service: "tenant"
