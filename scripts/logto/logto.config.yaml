# Logto declarative configuration.
# init.js reads this on every start and applies it idempotently.
# ${VAR} syntax is substituted from environment variables at runtime.
#
# Adding a new service:
#   1. Add its scopes under resources[].scopes
#   2. Assign them to the appropriate role(s) under roles[] and/or organization_roles[]
#   Registrator picks up the scope→role mapping automatically (user roles + org roles merged).

resources:
  - name: Infra API
    indicator: "${API_RESOURCE_INDICATOR}"
    scopes:
      # service-a
      - name: read:items
        description: Read items
      - name: write:items
        description: Create or update items
      - name: delete:items
        description: Delete items

# Global user roles — not scoped to any organization.
roles:
  - name: admin
    description: Platform administrator — full access to everything
    scopes:
      - read:items
      - write:items
      - delete:items

# Organization roles — scoped per organization.
# Resource scopes here are merged with user role scopes into one flat roles array in the JWT.
organization_roles:
  - name: org_owner
    description: Organization owner — full access within the organization
    scopes:
      - read:items
      - write:items
      - delete:items

  - name: org_user
    description: Organization member — standard access
    scopes:
      - read:items
      - write:items

jwt:
  access_token:
    include_roles: true
